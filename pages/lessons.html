        </div>


        <nav

            aria-label="Main navigation"

            <a
                href="../index.html"
                class="nav-item"
            >

                <span data-lucide="house"></span>

                <span>
                    Home
                </span>

            </a>


            <a
                href="lessons.html"
                class="nav-item active"
                aria-current="page"
            >

                <span data-lucide="book-open"></span>

                <span>
                    Lessons
                </span>

            </a>


            <a

                class="nav-item"

                </span>

            </a>


            <a

            >

                <span>
                    Gallery

            </a>

        <!-- ==================================================
             SIDEBAR FOOTER
             ================================================== -->

        <div class="sidebar-footer">


            <!-- GUEST -->

            <div
                class="sidebar-guest"
                id="sidebarGuest"
            >

                <div class="sidebar-guest-icon">

                    <span data-lucide="user-round"></span>

                </div>

                <div class="sidebar-guest-copy">

                    <strong>

                </div>

        <!-- ==================================================

                Do NOT put lesson cards inside here.

                class="lessons-page-container"
            >

                    <div class="lessons-state-icon">

                        <span data-lucide="book-open"></span>

                    </div>

                        Loading lessons...

                        Please wait while your lessons are loaded.

            </div>

        </section>

    </main>

        </span>

    <a

        id="memberBottomProfile"

    >

        <span
            class="bottom-nav-avatar"
            id="bottomAvatar"
        >
            A
        </span>

        <span>
            Profile
        </span>

    </a>

</nav>


<!-- ==========================================================
     MOBILE OVERLAY
     ========================================================== -->

<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>


<!-- ==========================================================
     JAVASCRIPT
     ========================================================== -->


<!-- CONFIG -->

<script src="../js/config.js"></script>


<!-- API -->

<script src="../js/api.js"></script>


<!-- AUTH -->

<script src="../js/auth.js"></script>

<script src="../js/auth-state.js"></script>

<script src="../js/pages/lessons.js"></script>


<!-- APP -->

<script src="../js/app.js"></script>


<!-- HOME CONTROLLER

     We use the same home controller because it currently
     contains the shared sidebar, mobile menu, account,
     authentication and logout behaviour.
-->

<script src="../js/home.js"></script>


<script>

    /*
     * ========================================================
     * LESSONS PAGE STARTUP
     * ========================================================
     *
     * LessonsPage is responsible for rendering:
     *
     * - Loading state
     * - Current lesson
     * - Previous lessons
     * - Lesson reader
     * - Reading progress
     * - Back button
     *
     * This page only provides the container.
     */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const container =
                document.getElementById(
                    "lessonsPage"
                );


            if (
                !container
            ) {

                console.error(
                    "AFC Portal: lessonsPage container was not found."
                );

                return;
            }


            if (
                window.LessonsPage &&
                typeof window.LessonsPage.render === "function"
            ) {

                window.LessonsPage.render(
                    container
                );

            } else {

                console.error(
                    "AFC Portal: LessonsPage module was not loaded."
                );

                container.innerHTML = `

                    <div class="lessons-state">

                        <div class="lessons-state-icon">
                            !
                        </div>

                        <h3>
                            Lessons module unavailable
                        </h3>

                        <p>
                            The lessons system could not be loaded.
                            Please refresh the page and try again.
                        </p>

                    </div>

                `;

            }

        }
    );

</script>


<!-- ==========================================================
     INITIAL ICON RENDER
     ========================================================== -->

<script>

    if (
        window.lucide &&
        typeof window.lucide.createIcons === "function"
    ) {

        window.lucide.createIcons();

    }

</script>
