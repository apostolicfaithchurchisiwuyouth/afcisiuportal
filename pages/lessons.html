<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#4a0754"
    >

    <meta
        name="description"
        content="AFC Isiu Youth Portal — Weekly Bible lessons."
    >

    <title>
        Lessons — AFC Isiu Youth Portal
    </title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet"
    >


    <!-- Core CSS -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/lessons.css"
    >

    <link
        rel="stylesheet"
        href="../css/loader.css"
    >


    <!-- Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


<div class="app-shell">


    <!-- ======================================================
         SIDEBAR
         ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-mark">

                <span data-lucide="church"></span>

            </div>

            <div class="brand-text">

                <strong>
                    AFC Isiu
                </strong>

                <span>
                    Youth Portal
                </span>

            </div>

        </div>


        <nav
            class="sidebar-navigation"
            aria-label="Main navigation"
        >

            <a
                href="../index.html"
                class="nav-item"
            >

                <span data-lucide="house"></span>

                <span>
                    Home
                </span>

            </a>


            <a
                href="lessons.html"
                class="nav-item active"
            >

                <span data-lucide="book-open"></span>

                <span>
                    Lessons
                </span>

            </a>


            <a
                href="quiz.html"
                class="nav-item"
            >

                <span data-lucide="clipboard-check"></span>

                <span>
                    Quiz
                </span>

            </a>


            <a
                href="gallery.html"
                class="nav-item"
            >

                <span data-lucide="images"></span>

                <span>
                    Gallery
                </span>

            </a>


            <a
                href="profile.html"
                class="nav-item member-only"
                hidden
            >

                <span data-lucide="user-round"></span>

                <span>
                    Profile
                </span>

            </a>


            <a
                href="notifications.html"
                class="nav-item member-only"
                hidden
            >

                <span data-lucide="bell"></span>

                <span>
                    Notifications
                </span>

            </a>

        </nav>


        <div class="sidebar-footer">

            <div
                class="sidebar-guest"
                id="sidebarGuest"
            >

                <div class="sidebar-guest-icon">

                    <span data-lucide="user-round"></span>

                </div>

                <div class="sidebar-guest-copy">

                    <strong>
                        Welcome
                    </strong>

                    <small>
                        Sign in to access your account
                    </small>

                </div>

            </div>


            <div
                class="sidebar-member"
                id="sidebarMember"
                hidden
            >

                <a
                    href="profile.html"
                    class="sidebar-profile"
                >

                    <div class="avatar">

                        <span id="sidebarAvatar">
                            A
                        </span>

                    </div>

                    <div>

                        <strong id="sidebarUserName">
                            Member
                        </strong>

                        <small>
                            My Profile
                        </small>

                    </div>

                </a>


                <button
                    type="button"
                    class="sidebar-logout"
                    id="sidebarLogoutButton"
                >

                    <span data-lucide="log-out"></span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </aside>


    <!-- ======================================================
         MAIN
         ====================================================== -->

    <main class="main-area">


        <header class="top-header">

            <div class="header-left">

                <button
                    type="button"
                    class="icon-button mobile-menu-button"
                    id="mobileMenuButton"
                    aria-label="Open navigation menu"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >

                    <span data-lucide="menu"></span>

                </button>


                <a
                    href="../index.html"
                    class="mobile-brand"
                >

                    <span class="mobile-brand-icon">

                        <span data-lucide="church"></span>

                    </span>


                    <span class="mobile-brand-text">

                        <strong>
                            AFC Isiu
                        </strong>

                        <small>
                            Youth Portal
                        </small>

                    </span>

                </a>

            </div>


            <div class="header-actions">

                <a
                    href="login.html"
                    class="header-avatar"
                    id="headerAccountButton"
                    aria-label="Login"
                >

                    <span
                        id="headerAvatarLetter"
                        class="header-avatar-content"
                    >

                        <span data-lucide="user-round"></span>

                    </span>

                </a>

            </div>

        </header>


        <!-- ==================================================
             PAGE CONTENT
             ================================================== -->

        <section
            class="page-content"
            id="lessonsPageContent"
        >

            <!-- LessonsPage renders here -->

        </section>

    </main>

</div>


<!-- =========================================================
     MOBILE NAVIGATION
     ========================================================= -->

<nav
    class="bottom-navigation"
    aria-label="Mobile navigation"
>

    <a
        href="../index.html"
        class="bottom-nav-item"
    >

        <span
            class="bottom-nav-icon"
            data-lucide="house"
        ></span>

        <span>
            Home
        </span>

    </a>


    <a
        href="lessons.html"
        class="bottom-nav-item active"
    >

        <span
            class="bottom-nav-icon"
            data-lucide="book-open"
        ></span>

        <span>
            Lessons
        </span>

    </a>


    <a
        href="quiz.html"
        class="bottom-nav-item bottom-nav-center"
        aria-label="Quiz"
    >

        <span class="bottom-nav-main">

            <span
                data-lucide="clipboard-check"
                class="bottom-nav-main-icon"
            ></span>

        </span>

        <span class="bottom-nav-center-label">
            Quiz
        </span>

    </a>


    <a
        href="gallery.html"
        class="bottom-nav-item"
    >

        <span
            class="bottom-nav-icon"
            data-lucide="images"
        ></span>

        <span>
            Gallery
        </span>

    </a>


    <a
        href="login.html"
        class="bottom-nav-item"
        id="guestBottomProfile"
    >

        <span
            class="bottom-nav-icon"
            data-lucide="user-round"
        ></span>

        <span>
            Account
        </span>

    </a>


    <a
        href="profile.html"
        class="bottom-nav-item"
        id="memberBottomProfile"
        hidden
    >

        <span
            class="bottom-nav-avatar"
            id="bottomAvatar"
        >
            A
        </span>

        <span>
            Profile
        </span>

    </a>

</nav>


<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="../js/config.js"></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/auth-state.js"></script>

<script src="../js/global-loader.js"></script>

<script src="../js/app.js"></script>

<script src="../js/pages/lessons.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const container =
            document.getElementById(
                "lessonsPageContent"
            );


        if (
            window.LessonsPage &&
            container
        ) {

            LessonsPage.render(
                container
            );

        }


        if (
            window.lucide &&
            typeof window.lucide.createIcons ===
                "function"
        ) {

            window.lucide.createIcons();

        }

    }
);

</script>


</body>

</html>
