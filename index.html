<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0a0016"
    >

    <meta
        name="description"
        content="AFC Isiwu Youth Portal"
    >

    <title>AFC Isiwu Youth Portal</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,600;10..48,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         TAILWIND
         ===================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =====================================================
         TAILWIND CONFIG
         ===================================================== -->

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        afc: {

                            950: "#0a0016",

                            900: "#14001f",

                            800: "#25002f",

                            700: "#360442",

                            600: "#4a0754",

                            500: "#64106f",

                            400: "#84258f"

                        }

                    },

                    fontFamily: {

                        display: [
                            "Bricolage Grotesque",
                            "sans-serif"
                        ],

                        body: [
                            "DM Sans",
                            "sans-serif"
                        ]

                    }

                }

            }

        };

    </script>


    <!-- =====================================================
         APPLICATION CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./css/app.css"
    >


    <!-- =====================================================
         PWA
         ===================================================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

</head>


<body>

    <!-- =====================================================
         APPLICATION ROOT
         ===================================================== -->

    <div id="app">

        <!-- Application content is rendered here -->

    </div>


    <!-- =====================================================
         GLOBAL MODAL ROOT
         ===================================================== -->

    <div id="modal-root"></div>


    <!-- =====================================================
         GLOBAL TOAST ROOT
         ===================================================== -->

    <div id="toast-root"></div>


    <!-- =====================================================
         GLOBAL LOADER ROOT
         ===================================================== -->

    <div id="loader-root"></div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="./js/core/state.js"></script>

    <script src="./js/core/helpers.js"></script>

    <script src="./js/core/api.js"></script>

    <script src="./js/core/router.js"></script>

    <script src="./js/components/modal.js"></script>

    <script src="./js/components/toast.js"></script>

    <script src="./js/components/loader.js"></script>

    <script src="./js/app.js"></script>

</body>

</html>
