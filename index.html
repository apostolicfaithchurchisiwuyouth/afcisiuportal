<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a0016"
    >

    <meta
        name="description"
        content="AFC Isiwu Youth Portal"
    >

    <title>AFC Isiwu Youth Portal</title>


    <!-- ======================================================
         FONTS
    ======================================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ======================================================
         TAILWIND DEVELOPMENT
    ======================================================= -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    fontFamily: {

                        display: [
                            'Bricolage Grotesque',
                            'sans-serif'
                        ],

                        body: [
                            'DM Sans',
                            'sans-serif'
                        ]

                    },

                    colors: {

                        portal: {

                            950: '#0a0016',

                            900: '#14001f',

                            800: '#23002f',

                            700: '#350044',

                            600: '#4a0754',

                            500: '#64106f',

                            400: '#8a2a92'

                        }

                    }

                }

            }

        };

    </script>


    <!-- ======================================================
         CUSTOM CSS
    ======================================================= -->

    <link
        rel="stylesheet"
        href="css/app.css"
    >

</head>


<body class="font-body bg-portal-950 text-white">


    <!-- ======================================================
         APPLICATION
    ======================================================= -->

    <div id="app">

        <!-- Application shell is rendered by app.js -->

        <div
            id="app-loading"
            class="min-h-screen flex items-center justify-center"
        >

            <div class="text-center">

                <div
                    class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto mb-4"
                ></div>

                <p class="text-sm text-white/60">
                    Loading AFC Isiwu Youth Portal...
                </p>

            </div>

        </div>

    </div>


    <!-- ======================================================
         MODAL ROOT
    ======================================================= -->

    <div id="modal-root"></div>


    <!-- ======================================================
         TOAST ROOT
    ======================================================= -->

    <div
        id="toast-root"
        class="fixed top-5 right-5 z-[9999] space-y-3"
    ></div>


    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="js/state.js"></script>

    <script src="js/api.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/modal.js"></script>

    <script src="js/router.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
