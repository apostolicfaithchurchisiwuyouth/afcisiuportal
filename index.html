<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0a0016"
    >

    <meta
        name="description"
        content="AFC Isiwu Youth Portal"
    >

    <title>AFC Isiwu Youth Portal</title>

    <!-- ======================================================
         GOOGLE FONTS
         ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ======================================================
         LUCIDE ICONS
         ====================================================== -->

    <script
        src="https://unpkg.com/lucide@latest"
    ></script>

    <!-- ======================================================
         APP CSS
         ====================================================== -->

    <link rel="stylesheet" href="css/app.css">

</head>


<body>

    <!-- =========================================================
     AUTHENTICATION SCREEN
     ========================================================= -->

<div
    id="auth-screen"
    class="hidden"
    aria-live="polite"
></div>

    <!-- ======================================================
         APPLICATION
         ====================================================== -->

    <div id="app">

        <!-- ==================================================
             HEADER
             ================================================== -->

        <header
            id="app-header"
            class="app-header"
        >

            <div class="header-left">

                <button
                    id="menu-button"
                    class="icon-button"
                    type="button"
                    aria-label="Open menu"
                >
                    <i data-lucide="menu"></i>
                </button>


                <div class="brand">

                    <div class="brand-mark">
                        <i data-lucide="church"></i>
                    </div>

                    <div class="brand-text">

                        <span class="brand-name">
                            AFC Isiwu
                        </span>

                        <span class="brand-subtitle">
                            Youth Portal
                        </span>

                    </div>

                </div>

            </div>


            <div class="header-right">

                <button
                    id="notification-button"
                    class="icon-button"
                    type="button"
                    aria-label="Notifications"
                >

                    <i data-lucide="bell"></i>

                    <span
                        id="notification-badge"
                        class="notification-badge hidden"
                    >
                        0
                    </span>

                </button>

            </div>

        </header>


        <!-- ==================================================
             SIDEBAR
             ================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-header">

                <div class="sidebar-brand">

                    <div class="brand-mark">
                        <i data-lucide="church"></i>
                    </div>

                    <div>

                        <div class="brand-name">
                            AFC Isiwu
                        </div>

                        <div class="brand-subtitle">
                            Youth Portal
                        </div>

                    </div>

                </div>


                <button
                    id="close-sidebar"
                    class="icon-button"
                    type="button"
                    aria-label="Close menu"
                >
                    <i data-lucide="x"></i>
                </button>

            </div>


            <nav
                id="sidebar-navigation"
                class="sidebar-navigation"
            >

                <button
                    class="nav-item active"
                    data-page="home"
                    type="button"
                >

                    <i data-lucide="house"></i>

                    <span>Home</span>

                </button>


                <button
                    class="nav-item"
                    data-page="lessons"
                    type="button"
                >

                    <i data-lucide="book-open"></i>

                    <span>Lessons</span>

                </button>


                <button
                    class="nav-item"
                    data-page="gallery"
                    type="button"
                >

                    <i data-lucide="images"></i>

                    <span>Gallery</span>

                </button>


                <button
                    class="nav-item"
                    data-page="profile"
                    type="button"
                >

                    <i data-lucide="user-round"></i>

                    <span>Profile</span>

                </button>


                <button
                    class="nav-item"
                    data-page="settings"
                    type="button"
                >

                    <i data-lucide="settings"></i>

                    <span>Settings</span>

                </button>

            </nav>


            <div class="sidebar-footer">

                <button
                    id="sidebar-login-button"
                    class="sidebar-action"
                    type="button"
                >

                    <i data-lucide="log-in"></i>

                    <span>Login</span>

                </button>

            </div>

        </aside>


        <!-- ==================================================
             SIDEBAR OVERLAY
             ================================================== -->

        <div
            id="sidebar-overlay"
            class="sidebar-overlay"
        ></div>


        <!-- ==================================================
             MAIN CONTENT
             ================================================== -->

        <main
            id="main-content"
            class="main-content"
        >

            <!-- Pages are rendered here by app.js -->

            <div
                id="page-container"
                class="page-container"
            ></div>

        </main>


        <!-- ==================================================
             BOTTOM NAVIGATION
             ================================================== -->

        <nav
            id="bottom-navigation"
            class="bottom-navigation"
        >

            <button
                class="bottom-nav-item active"
                data-page="home"
                type="button"
            >

                <i data-lucide="house"></i>

                <span>Home</span>

            </button>


            <button
                class="bottom-nav-item"
                data-page="lessons"
                type="button"
            >

                <i data-lucide="book-open"></i>

                <span>Lessons</span>

            </button>


            <button
                id="main-action-button"
                class="main-action-button"
                type="button"
                aria-label="Open main menu"
            >

                <i data-lucide="plus"></i>

            </button>


            <button
                class="bottom-nav-item"
                data-page="gallery"
                type="button"
            >

                <i data-lucide="images"></i>

                <span>Gallery</span>

            </button>


            <button
                class="bottom-nav-item"
                data-page="profile"
                type="button"
            >

                <i data-lucide="user-round"></i>

                <span>Profile</span>

            </button>

        </nav>


        <!-- ==================================================
             GLOBAL LOADING
             ================================================== -->

        <div
            id="global-loading"
            class="global-loading hidden"
        >

            <div class="loading-card">

                <div class="loading-spinner"></div>

                <p>Loading...</p>

            </div>

        </div>


        <!-- ==================================================
             TOAST CONTAINER
             ================================================== -->

        <div
            id="toast-container"
            class="toast-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <!-- ==================================================
             MODAL ROOT
             ================================================== -->

        <div
            id="modal-root"
            class="modal-root"
        ></div>

    </div>


    <!-- ======================================================
         APPLICATION JAVASCRIPT
         ====================================================== -->

        <script src="js/core/state.js"></script>

    <script src="js/core/api.js"></script>

    <script src="js/components/ui.js"></script>

    <script src="js/components/modal.js"></script>

    <script src="js/core/router.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
